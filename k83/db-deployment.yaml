apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: workshop
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workshop
      component: database
  template:
    metadata:
      labels:
        app: workshop
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: workshop
            - name: POSTGRES_USER
              value: workshop
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc