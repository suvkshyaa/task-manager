apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: workshop
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workshop
      component: api
  template:
    metadata:
      labels:
        app: workshop
        component: api
    spec:
      containers:
        - name: backend
          image: workshop-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DB_HOST
              value: postgres-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: workshop
            - name: DB_USER
              value: workshop
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"